    type: APIReference
  - url: openapi/testrail-openapi.yml
    type: OpenAPI
  - url: collections/testrail.postman_collection.json
    type: PostmanCollection
  - url: collections/testrail.opencollection.json
    type: OpenCollection
  description: Create, retrieve, update, close, and delete test runs for a project.
    A test run is an execution of a set of test cases; get_runs lists runs for a
    project, add_run creates one (optionally scoped to specific cases), close_run
    archives it and its results. This is the surface behind the "test runs" QA
    workflow.
