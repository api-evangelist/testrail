  - url: openapi/testrail-openapi.yml
    type: OpenAPI
  - url: collections/testrail.postman_collection.json
    type: PostmanCollection
  - url: collections/testrail.opencollection.json
    type: OpenCollection
  description: Read and record test results. Retrieve results for a test, a case, or
    an entire run, and push new results back - individually (add_result,
    add_result_for_case) or in bulk (add_results, add_results_for_cases). The bulk
    endpoints are the recommended way for automated test suites to report status,
    elapsed time, defects, and comments into a run.
