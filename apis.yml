aid: testrail
url: https://raw.githubusercontent.com/api-evangelist/testrail/refs/heads/main/apis.yml
name: TestRail
kind: company
description: TestRail is a web-based test case management and QA platform (originally
  by Gurock, now part of IDERA) for organizing test cases, running test runs and test
  plans, and recording test results across manual and automated testing. Its HTTP
  API (v2) exposes projects, suites, sections, cases, runs, plans, tests, results,
  milestones, configurations, and users so teams can push automated results, create
  and close test runs, and sync test cases programmatically. The API is available on
  TestRail Cloud (per-instance host, e.g. https://{instance}.testrail.io) and on
  self-hosted TestRail Server/Enterprise, and uses the distinctive
  index.php?/api/v2/ URL style with HTTP Basic authentication (email plus password
  or API key).
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Test Runs
- Test Management
- QA
- Test Cases
- Test Results
- Test Plans
- Testing
- Test Automation
created: '2026-07-11'
modified: '2026-07-11'
