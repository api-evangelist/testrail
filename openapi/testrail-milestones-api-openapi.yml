openapi: 3.2.0
info:
  title: TestRail API (v2) Milestones API
  description: TestRail is a web-based test case management and QA platform.
  version: '2.0'
  contact:
    name: TestRail (IDERA)
    url: https://www.testrail.com
  x-transport-note: The real request URL embeds the API version in a query string via index.php, e.g. https://example.testrail.io/index.php?/api/v2/get_run/1 - this is intentional and specific to TestRail, not a normal REST path.
servers:
- url: https://{instance}.testrail.io/index.php?/api/v2
  description: TestRail Cloud (per-instance host; replace {instance} with your subdomain)
  variables:
    instance:
      default: example
      description: Your TestRail Cloud subdomain.
- url: https://{host}/index.php?/api/v2
  description: TestRail Server / Enterprise (self-hosted; replace {host} with your install host)
  variables:
    host:
      default: testrail.example.com
      description: Hostname of your self-hosted TestRail installation.
security:
- basicAuth: []
tags:
- name: Milestones
  description: Releases and deadlines that runs and plans report toward.
paths:
  /get_milestones/{project_id}:
    get:
      operationId: getMilestones
      tags:
      - Milestones
      summary: Get milestones
      description: Returns a list of milestones for a project.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A list of milestones.
  /get_milestone/{milestone_id}:
    get:
      operationId: getMilestone
      tags:
      - Milestones
      summary: Get milestone
      description: Returns an existing milestone.
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: The requested milestone.
  /add_milestone/{project_id}:
    post:
      operationId: addMilestone
      tags:
      - Milestones
      summary: Add milestone
      description: Creates a new milestone in a project.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created milestone.
  /update_milestone/{milestone_id}:
    post:
      operationId: updateMilestone
      tags:
      - Milestones
      summary: Update milestone
      description: Updates an existing milestone (for example to mark it completed).
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The updated milestone.
  /delete_milestone/{milestone_id}:
    post:
      operationId: deleteMilestone
      tags:
      - Milestones
      summary: Delete milestone
      description: Deletes an existing milestone.
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: Deletion confirmation.
components:
  parameters:
    Offset:
      name: offset
      in: query
      required: false
      description: Number of records to skip for pagination on bulk endpoints.
      schema:
        type: integer
        minimum: 0
    ProjectId:
      name: project_id
      in: path
      required: true
      description: The ID of the project.
      schema:
        type: integer
    MilestoneId:
      name: milestone_id
      in: path
      required: true
      description: The ID of the milestone.
      schema:
        type: integer
    Limit:
      name: limit
      in: query
      required: false
      description: Number of records to return (1-250; bulk endpoints default and cap at 250).
      schema:
        type: integer
        minimum: 1
        maximum: 250
        default: 250
  requestBodies:
    GenericJson:
      required: true
      description: JSON request body. Field names follow the TestRail API reference for the specific method (see the method's support.testrail.com article).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication. Username is your TestRail email; password is your account password or an API key generated under My Settings. The API must be enabled by an admin under Administration > Site Settings > API.
