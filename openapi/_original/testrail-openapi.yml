openapi: 3.0.3
info:
  title: TestRail API (v2)
  description: >-
    TestRail is a web-based test case management and QA platform. This document
    models the TestRail HTTP API v2, which lets teams manage projects, suites,
    sections, test cases, test runs, test plans, individual tests, results,
    milestones, configurations, and users.


    TestRail runs on a per-customer instance: TestRail Cloud is hosted at
    https://{instance}.testrail.io (older Cloud instances use .testrail.com), and
    TestRail Server / Enterprise is self-hosted on your own host. There is no
    single shared public endpoint.


    URL style: every call is routed through TestRail's `index.php` front
    controller, so the effective base is `https://{instance}.testrail.io/index.php?/api/v2`
    and a method looks like `GET /index.php?/api/v2/get_run/1`. The `?/api/v2/...`
    is a rewritten query string that TestRail treats as the API path. In this
    document the servers entry carries the `index.php?/api/v2` prefix and each
    path is the method name plus its id/parent segment.


    Authentication is HTTP Basic: the username is your TestRail email and the
    password is your account password or an API key generated under My Settings.
    The API must be enabled by an administrator under Administration > Site
    Settings > API. All payloads are JSON.


    Bulk GET endpoints (get_cases, get_runs, get_results, etc.) return up to 250
    records per page and accept `limit` (1-250) and `offset` for pagination.
  version: '2.0'
  contact:
    name: TestRail (IDERA)
    url: https://www.testrail.com
  x-transport-note: >-
    The real request URL embeds the API version in a query string via
    index.php, e.g. https://example.testrail.io/index.php?/api/v2/get_run/1 -
    this is intentional and specific to TestRail, not a normal REST path.
servers:
  - url: https://{instance}.testrail.io/index.php?/api/v2
    description: TestRail Cloud (per-instance host; replace {instance} with your subdomain)
    variables:
      instance:
        default: example
        description: Your TestRail Cloud subdomain.
  - url: https://{host}/index.php?/api/v2
    description: TestRail Server / Enterprise (self-hosted; replace {host} with your install host)
    variables:
      host:
        default: testrail.example.com
        description: Hostname of your self-hosted TestRail installation.
security:
  - basicAuth: []
tags:
  - name: Projects
    description: Top-level containers owning suites, cases, runs, plans, and milestones.
  - name: Suites
    description: Collections of test cases within a project.
  - name: Sections
    description: Folder-like grouping of test cases inside a suite.
  - name: Cases
    description: Reusable test cases in the repository.
  - name: Runs
    description: Executions of a set of test cases (test runs).
  - name: Tests
    description: Instances of a case within a specific run.
  - name: Results
    description: Recorded outcomes for tests and cases.
  - name: Plans
    description: Groups of runs, optionally across configurations.
  - name: Milestones
    description: Releases and deadlines that runs and plans report toward.
  - name: Configurations
    description: Configuration groups (e.g. browsers, OSes) plan entries expand across.
  - name: Users
    description: TestRail user lookup.
paths:
  /get_projects:
    get:
      operationId: getProjects
      tags: [Projects]
      summary: Get projects
      description: Returns the list of available projects.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A list of projects.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /get_project/{project_id}:
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get project
      description: Returns an existing project by ID.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The requested project.
        '400':
          $ref: '#/components/responses/BadRequest'
  /add_project:
    post:
      operationId: addProject
      tags: [Projects]
      summary: Add project
      description: Creates a new project (admin status required).
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created project.
        '403':
          $ref: '#/components/responses/Forbidden'
  /update_project/{project_id}:
    post:
      operationId: updateProject
      tags: [Projects]
      summary: Update project
      description: Updates an existing project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The updated project.
  /delete_project/{project_id}:
    post:
      operationId: deleteProject
      tags: [Projects]
      summary: Delete project
      description: Deletes an existing project. This cannot be undone.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Deletion confirmation.
  /get_suites/{project_id}:
    get:
      operationId: getSuites
      tags: [Suites]
      summary: Get suites
      description: Returns a list of test suites for a project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: A list of suites.
  /get_suite/{suite_id}:
    get:
      operationId: getSuite
      tags: [Suites]
      summary: Get suite
      description: Returns an existing test suite.
      parameters:
        - $ref: '#/components/parameters/SuiteId'
      responses:
        '200':
          description: The requested suite.
  /add_suite/{project_id}:
    post:
      operationId: addSuite
      tags: [Suites]
      summary: Add suite
      description: Creates a new test suite in a project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created suite.
  /update_suite/{suite_id}:
    post:
      operationId: updateSuite
      tags: [Suites]
      summary: Update suite
      description: Updates an existing test suite.
      parameters:
        - $ref: '#/components/parameters/SuiteId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The updated suite.
  /delete_suite/{suite_id}:
    post:
      operationId: deleteSuite
      tags: [Suites]
      summary: Delete suite
      description: Deletes an existing test suite.
      parameters:
        - $ref: '#/components/parameters/SuiteId'
      responses:
        '200':
          description: Deletion confirmation.
  /get_sections/{project_id}:
    get:
      operationId: getSections
      tags: [Sections]
      summary: Get sections
      description: Returns a list of sections for a project and optional suite.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: suite_id
          in: query
          required: false
          description: The ID of the test suite (optional if the project is single-suite).
          schema:
            type: integer
      responses:
        '200':
          description: A list of sections.
  /add_section/{project_id}:
    post:
      operationId: addSection
      tags: [Sections]
      summary: Add section
      description: Creates a new section in a project's suite.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created section.
  /update_section/{section_id}:
    post:
      operationId: updateSection
      tags: [Sections]
      summary: Update section
      description: Updates an existing section.
      parameters:
        - name: section_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The updated section.
  /delete_section/{section_id}:
    post:
      operationId: deleteSection
      tags: [Sections]
      summary: Delete section
      description: Deletes an existing section and all contained cases.
      parameters:
        - name: section_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deletion confirmation.
  /get_cases/{project_id}:
    get:
      operationId: getCases
      tags: [Cases]
      summary: Get cases
      description: >-
        Returns a list of test cases for a project and optional suite. Bulk
        endpoint - returns up to 250 records per page; use limit and offset to
        page. Supports filters such as suite_id, section_id, and updated_after.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: suite_id
          in: query
          required: false
          schema:
            type: integer
        - name: section_id
          in: query
          required: false
          schema:
            type: integer
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A list of test cases.
  /get_case/{case_id}:
    get:
      operationId: getCase
      tags: [Cases]
      summary: Get case
      description: Returns an existing test case.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: The requested test case.
  /add_case/{section_id}:
    post:
      operationId: addCase
      tags: [Cases]
      summary: Add case
      description: Creates a new test case in a section.
      parameters:
        - name: section_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created test case.
  /update_case/{case_id}:
    post:
      operationId: updateCase
      tags: [Cases]
      summary: Update case
      description: Updates an existing test case.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The updated test case.
  /delete_case/{case_id}:
    post:
      operationId: deleteCase
      tags: [Cases]
      summary: Delete case
      description: Deletes an existing test case.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Deletion confirmation.
  /get_case_fields:
    get:
      operationId: getCaseFields
      tags: [Cases]
      summary: Get case fields
      description: Returns a list of available custom fields for test cases.
      responses:
        '200':
          description: A list of case fields.
  /get_case_types:
    get:
      operationId: getCaseTypes
      tags: [Cases]
      summary: Get case types
      description: Returns a list of available case types.
      responses:
        '200':
          description: A list of case types.
  /get_runs/{project_id}:
    get:
      operationId: getRuns
      tags: [Runs]
      summary: Get runs
      description: >-
        Returns a list of test runs for a project. Does not include runs that
        are part of a test plan. Bulk endpoint - returns up to 250 records per
        page; use limit and offset to page. Supports filters such as
        is_completed, created_after, and milestone_id.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: is_completed
          in: query
          required: false
          description: 1 to return completed runs only, 0 for active runs only.
          schema:
            type: integer
            enum: [0, 1]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A list of test runs.
  /get_run/{run_id}:
    get:
      operationId: getRun
      tags: [Runs]
      summary: Get run
      description: Returns an existing test run, including pass/fail/blocked counts.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The requested test run.
  /add_run/{project_id}:
    post:
      operationId: addRun
      tags: [Runs]
      summary: Add run
      description: >-
        Creates a new test run in a project. By default it includes all test
        cases; set include_all to false and pass case_ids to scope the run to
        specific cases. May be assigned to a user and a milestone.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created test run.
  /update_run/{run_id}:
    post:
      operationId: updateRun
      tags: [Runs]
      summary: Update run
      description: Updates an existing test run (same fields as add_run except suite_id).
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The updated test run.
  /close_run/{run_id}:
    post:
      operationId: closeRun
      tags: [Runs]
      summary: Close run
      description: Closes an existing test run and archives its tests and results. This cannot be undone.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The closed test run.
  /delete_run/{run_id}:
    post:
      operationId: deleteRun
      tags: [Runs]
      summary: Delete run
      description: Deletes an existing test run.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Deletion confirmation.
  /get_tests/{run_id}:
    get:
      operationId: getTests
      tags: [Tests]
      summary: Get tests
      description: >-
        Returns a list of tests for a test run. Bulk endpoint - returns up to
        250 records per page; use limit and offset to page. Supports a status_id
        filter.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A list of tests in the run.
  /get_test/{test_id}:
    get:
      operationId: getTest
      tags: [Tests]
      summary: Get test
      description: Returns an existing test (a case instance within a run).
      parameters:
        - name: test_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The requested test.
  /get_results/{test_id}:
    get:
      operationId: getResults
      tags: [Results]
      summary: Get results for a test
      description: >-
        Returns a list of test results for a test. Bulk endpoint - returns up to
        250 records per page.
      parameters:
        - name: test_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A list of results for the test.
  /get_results_for_case/{run_id}/{case_id}:
    get:
      operationId: getResultsForCase
      tags: [Results]
      summary: Get results for a case in a run
      description: Returns a list of test results for a test run and case combination.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A list of results for the case in the run.
  /get_results_for_run/{run_id}:
    get:
      operationId: getResultsForRun
      tags: [Results]
      summary: Get results for a run
      description: >-
        Returns a list of test results for a test run. Bulk endpoint - returns
        up to 250 records per page; supports created_after and status_id filters.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A list of results for the run.
  /add_result/{test_id}:
    post:
      operationId: addResult
      tags: [Results]
      summary: Add result for a test
      description: >-
        Adds a new test result, comment, or assignment to a test. Requires a
        status_id and may include comment, elapsed, defects, and version.
      parameters:
        - name: test_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created result.
  /add_result_for_case/{run_id}/{case_id}:
    post:
      operationId: addResultForCase
      tags: [Results]
      summary: Add result for a case in a run
      description: Adds a new test result for a test run and case combination.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created result.
  /add_results/{run_id}:
    post:
      operationId: addResults
      tags: [Results]
      summary: Add results (bulk, by test)
      description: >-
        Adds one or more new test results in a single request, keyed by
        test_id. Recommended for automated suites to report many outcomes at
        once and reduce rate-limited calls.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created results.
  /add_results_for_cases/{run_id}:
    post:
      operationId: addResultsForCases
      tags: [Results]
      summary: Add results (bulk, by case)
      description: >-
        Adds one or more new test results in a single request, keyed by
        case_id. Preferred bulk endpoint for automation frameworks pushing
        results into a run.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created results.
  /get_plans/{project_id}:
    get:
      operationId: getPlans
      tags: [Plans]
      summary: Get plans
      description: >-
        Returns a list of test plans for a project. Bulk endpoint - returns up
        to 250 records per page.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A list of test plans.
  /get_plan/{plan_id}:
    get:
      operationId: getPlan
      tags: [Plans]
      summary: Get plan
      description: Returns an existing test plan, including its entries and runs.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: The requested test plan.
  /add_plan/{project_id}:
    post:
      operationId: addPlan
      tags: [Plans]
      summary: Add plan
      description: Creates a new test plan in a project, optionally with entries.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created test plan.
  /update_plan/{plan_id}:
    post:
      operationId: updatePlan
      tags: [Plans]
      summary: Update plan
      description: Updates an existing test plan (name, description, milestone).
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The updated test plan.
  /add_plan_entry/{plan_id}:
    post:
      operationId: addPlanEntry
      tags: [Plans]
      summary: Add plan entry
      description: >-
        Adds one or more new test runs to a plan as an entry, optionally
        expanded across configurations.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created plan entry.
  /update_plan_entry/{plan_id}/{entry_id}:
    post:
      operationId: updatePlanEntry
      tags: [Plans]
      summary: Update plan entry
      description: Updates one or more runs in a plan entry.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The updated plan entry.
  /delete_plan_entry/{plan_id}/{entry_id}:
    post:
      operationId: deletePlanEntry
      tags: [Plans]
      summary: Delete plan entry
      description: Deletes one or more runs from a plan.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion confirmation.
  /close_plan/{plan_id}:
    post:
      operationId: closePlan
      tags: [Plans]
      summary: Close plan
      description: Closes an existing test plan and archives its runs and results.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: The closed test plan.
  /delete_plan/{plan_id}:
    post:
      operationId: deletePlan
      tags: [Plans]
      summary: Delete plan
      description: Deletes an existing test plan.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Deletion confirmation.
  /get_milestones/{project_id}:
    get:
      operationId: getMilestones
      tags: [Milestones]
      summary: Get milestones
      description: Returns a list of milestones for a project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A list of milestones.
  /get_milestone/{milestone_id}:
    get:
      operationId: getMilestone
      tags: [Milestones]
      summary: Get milestone
      description: Returns an existing milestone.
      parameters:
        - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: The requested milestone.
  /add_milestone/{project_id}:
    post:
      operationId: addMilestone
      tags: [Milestones]
      summary: Add milestone
      description: Creates a new milestone in a project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created milestone.
  /update_milestone/{milestone_id}:
    post:
      operationId: updateMilestone
      tags: [Milestones]
      summary: Update milestone
      description: Updates an existing milestone (for example to mark it completed).
      parameters:
        - $ref: '#/components/parameters/MilestoneId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The updated milestone.
  /delete_milestone/{milestone_id}:
    post:
      operationId: deleteMilestone
      tags: [Milestones]
      summary: Delete milestone
      description: Deletes an existing milestone.
      parameters:
        - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: Deletion confirmation.
  /get_configs/{project_id}:
    get:
      operationId: getConfigs
      tags: [Configurations]
      summary: Get configurations
      description: Returns a list of available configurations grouped by configuration group.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: A list of configuration groups and configurations.
  /add_config_group/{project_id}:
    post:
      operationId: addConfigGroup
      tags: [Configurations]
      summary: Add configuration group
      description: Creates a new configuration group in a project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created configuration group.
  /add_config/{config_group_id}:
    post:
      operationId: addConfig
      tags: [Configurations]
      summary: Add configuration
      description: Creates a new configuration in a configuration group.
      parameters:
        - name: config_group_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        $ref: '#/components/requestBodies/GenericJson'
      responses:
        '200':
          description: The created configuration.
  /get_users:
    get:
      operationId: getUsers
      tags: [Users]
      summary: Get users
      description: Returns a list of users.
      responses:
        '200':
          description: A list of users.
  /get_user/{user_id}:
    get:
      operationId: getUser
      tags: [Users]
      summary: Get user
      description: Returns an existing user by ID.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The requested user.
  /get_user_by_email:
    get:
      operationId: getUserByEmail
      tags: [Users]
      summary: Get user by email
      description: Returns an existing user by email address.
      parameters:
        - name: email
          in: query
          required: true
          description: The email address to look up.
          schema:
            type: string
            format: email
      responses:
        '200':
          description: The requested user.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic authentication. Username is your TestRail email; password is
        your account password or an API key generated under My Settings. The API
        must be enabled by an admin under Administration > Site Settings > API.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: The ID of the project.
      schema:
        type: integer
    SuiteId:
      name: suite_id
      in: path
      required: true
      description: The ID of the test suite.
      schema:
        type: integer
    CaseId:
      name: case_id
      in: path
      required: true
      description: The ID of the test case.
      schema:
        type: integer
    RunId:
      name: run_id
      in: path
      required: true
      description: The ID of the test run.
      schema:
        type: integer
    PlanId:
      name: plan_id
      in: path
      required: true
      description: The ID of the test plan.
      schema:
        type: integer
    MilestoneId:
      name: milestone_id
      in: path
      required: true
      description: The ID of the milestone.
      schema:
        type: integer
    Limit:
      name: limit
      in: query
      required: false
      description: Number of records to return (1-250; bulk endpoints default and cap at 250).
      schema:
        type: integer
        minimum: 1
        maximum: 250
        default: 250
    Offset:
      name: offset
      in: query
      required: false
      description: Number of records to skip for pagination on bulk endpoints.
      schema:
        type: integer
        minimum: 0
  requestBodies:
    GenericJson:
      required: true
      description: >-
        JSON request body. Field names follow the TestRail API reference for the
        specific method (see the method's support.testrail.com article).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    Unauthorized:
      description: Missing or invalid credentials (HTTP Basic).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated user lacks permission (for example not an administrator).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid or unknown identifier or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >-
        Rate limit exceeded on TestRail Cloud. Includes a Retry-After header
        with the number of seconds to wait before retrying.
      headers:
        Retry-After:
          description: Seconds to wait before the next request is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message returned by TestRail.
