meters:
- name: seats
  description: Licensed TestRail users (seats); the primary cost driver on Cloud and Server.
  unit: users
  aggregation: sum
  dimensions:
  - account
  - tier
  - deployment
- name: tier
  description: Professional vs Enterprise edition, which sets per-seat rate, features, and API rate limit.
  unit: tier
  aggregation: max
  dimensions:
  - account
- name: self_hosted_infrastructure
  description: Compute, storage, and operations for running self-hosted TestRail Server (no TestRail usage invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track active vs licensed seats per tier and deployment; the API is included, so there is no per-call spend to meter.
- name: Allocation
  description: Map seats to teams/projects so per-user license cost aligns to the groups actually using TestRail.
- name: Optimization
  description: Reclaim inactive seats, right-size Professional vs Enterprise per team, and weigh Cloud subscription against self-hosted Server total cost of ownership; pick the tier whose API rate limit fits automation volume rather than over-buying.
- name: Accountability
  description: Assign an owner for the TestRail subscription; review seat counts and tier fit each renewal cycle.
