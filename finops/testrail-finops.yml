description: >-
  FinOps view of TestRail spend. TestRail is licensed per user (per seat), not by
  API call or usage volume, so cost is primarily a function of seat count and
  tier (Professional vs Enterprise) and deployment (Cloud vs self-hosted Server).
  The API is included with every paid seat and is not separately metered - there
  is no per-request charge. On TestRail Cloud the vendor invoice is the seat
  subscription; on self-hosted TestRail Server the dominant costs shift to the
  license plus the customer's own infrastructure and operations. Optimization is
  mostly about right-sizing seats and choosing the tier whose API rate limit and
  features match the team's automation needs.
notes: >-
  Per-seat rates are published on the TestRail pricing page and are not
  reconciled here. Because billing is per user rather than per API call, FinOps
  attention centers on active-seat management, tier selection, and Cloud-vs-Server
  total cost of ownership rather than usage metering.
